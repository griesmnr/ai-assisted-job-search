services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to loopback only: this ships with a placeholder password
      # (POSTGRES_PASSWORD=changeme in .env.example) and Docker Desktop on
      # macOS otherwise publishes container ports on all interfaces, which
      # would expose Postgres to the local network. Other containers must
      # reach it via the "postgres" hostname on jobsearch-net, not this
      # published port -- see README.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces a real TCP check instead of the local unix
      # socket, so this can't report healthy while initdb is still running
      # on first boot (the socket can appear ready slightly before the
      # server is actually accepting TCP connections).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - jobsearch-net

  rabbitmq:
    image: rabbitmq:3.13.7-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      # Loopback only -- see the postgres port comment above; the same
      # reasoning applies to the AMQP port and, especially, the management
      # UI, which would otherwise expose login to the local network.
      - "127.0.0.1:5672:5672"   # AMQP
      - "127.0.0.1:15672:15672" # management UI, http://localhost:15672 from the Mac host
    volumes:
      # Without this, `docker compose down` wipes queue/exchange definitions
      # and any dead-lettered messages -- on a project whose whole point is
      # demonstrating DLQs, that's a real loss, not just inconvenience.
      # If you change RABBITMQ_DEFAULT_USER/PASS after the volume already
      # has data, RabbitMQ will NOT pick up the new credentials (they only
      # apply on first boot with an empty data dir) -- run `docker compose
      # down -v` first to reset.
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # check_port_connectivity is a lighter, more specific signal than
      # check_running (which reports healthy before listeners are all up);
      # this is closer to "can a client actually connect".
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - jobsearch-net

  dev:
    # Not started by a plain `docker compose up -d` -- only postgres and
    # rabbitmq are (the profiles list on THIS service, not on the others).
    # Building this image compiles git-bug from source, which downloads a
    # ~250MB Go toolchain and runs a full Vite build of git-bug's web UI --
    # 10-20 minutes on a cold cache. Gating Postgres/RabbitMQ startup behind
    # that would be a bad first impression for a ticket that only asked for
    # infra. Run `docker compose --profile dev up -d --build` (or `docker
    # compose up -d --build dev`) to include it.
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Service-name endpoints for reaching the other containers. NOT
      # localhost -- localhost inside this container is this container.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_MANAGEMENT_PORT: 15672
    volumes:
      - .:/workspace
    working_dir: /workspace
    tty: true
    stdin_open: true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - jobsearch-net

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  jobsearch-net:
    driver: bridge
